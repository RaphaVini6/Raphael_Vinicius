name: spacy-legacy

# docker compose up --build
# site: http://localhost:8080   api docs (Development only): http://localhost:5050/scalar
# values come from .env (see .env.example)

# the .NET images have no curl, so the health check just opens a TCP connection to the app port
x-dotnet-health: &dotnet-health
  test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 15s

services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # inside the docker network the services find each other by name
      Apis__VLibras__BaseUrl: http://api-1-vlibras:8080
      Apis__Speech__BaseUrl: http://api-2-speech:8080
    # 5050 on the host so it does not clash with "dotnet run" (5000) during local development
    ports:
      - "${BACKEND_PORT:-5050}:8080"
    healthcheck: *dotnet-health
    depends_on:
      api-1-vlibras:
        condition: service_healthy
      api-2-speech:
        condition: service_healthy
    restart: unless-stopped

  api-1-vlibras:
    build: ./api-1-vlibras
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      VLibras__BaseUrl: ${VLibras__BaseUrl:-https://traducao2.vlibras.gov.br}
      VLibras__Token: ${VLibras__Token:-}
    healthcheck: *dotnet-health
    restart: unless-stopped

  api-2-speech:
    build: ./api-2-speech
    # only this service gets the speech keys
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Speech__CacheDir: /data/audio-cache
      Speech__Knowlez__Key: ${Speech__Knowlez__Key:-}
      Speech__Azure__Key: ${Speech__Azure__Key:-}
      Speech__Azure__Region: ${Speech__Azure__Region:-brazilsouth}
    volumes:
      - speech-cache:/data
    healthcheck: *dotnet-health
    restart: unless-stopped

volumes:
  # keeps generated audio between restarts (the Knowlez trial only has 50 requests)
  speech-cache:
